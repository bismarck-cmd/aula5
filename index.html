<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        .container-v {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header, footer {
            background-color: #808080;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex: 8;
        }

        section {
        flex: 1;
        background-color: #808080;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* empurra o article pra baixo */
        align-items: center;
        }

        aside {
            flex: 1;
            background-color: #808080;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        article {
        width: 100%;
        height: 80px; /* deixa pequeno */
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        p {
            margin: 0;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container-v">
        <header>
            <p>HEADER</p>
        </header>

        <div class="container">
            <section>
                <p>SECTION</p>
                <article>
                    <p>ARTICLE</p>
                </article>
            </section>

            <aside>
                <p>ASIDE</p>
            </aside>
        </div>

        <footer>
            <p>FOOTER</p>
        </footer>
    </div>
</body>
</html>
